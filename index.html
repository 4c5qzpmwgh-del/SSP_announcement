<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSP 公告生成</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f0f4f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04); }
        .cat-checkbox { display: none; }
        .cat-label {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 16px; border: 1px solid #e2e8f0; border-radius: 9999px;
            font-size: 13px; color: #64748b; background-color: #ffffff;
            cursor: pointer; transition: all 0.2s ease; user-select: none;
        }
        .cat-label:hover { border-color: #6366f1; color: #4f46e5; }
        .cat-checkbox:checked + .cat-label {
            background-color: #4f46e5; border-color: #4f46e5; color: #ffffff;
            box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3);
        }
        .mode-btn {
            border-radius: 9999px; font-size: 13px; font-weight: 600; padding: 6px 18px;
            border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer;
        }
        .mode-btn.active-dsg { background-color: #4f46e5; border-color: #4f46e5; color: #ffffff; box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3); }
        .mode-btn.active-ssp { background-color: #0284c7; border-color: #0284c7; color: #ffffff; box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3); }
        .mode-btn.active-maint { background-color: #1e293b; border-color: #1e293b; color: #ffffff; box-shadow: 0 2px 6px rgba(30, 41, 59, 0.3); }
        input:disabled { background-color: #f1f5f9; cursor: not-allowed; opacity: 0.7; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <!-- 標題 -->
        <div class="flex items-center gap-3 mb-6">
            <span class="bg-indigo-600 text-white font-extrabold text-xs px-2.5 py-1.5 rounded-lg shadow-sm">SSP</span>
            <h1 class="text-2xl font-extrabold text-slate-800">公告生成</h1>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- 左側操作表單 -->
            <div class="lg:col-span-7 space-y-6">
                <div class="card p-6 border border-slate-100 space-y-5">
                    
                    <!-- 1. 選擇類別 -->
                    <div>
                        <label class="block text-sm font-bold text-slate-800 mb-3">1. 選擇類別 (可多選)</label>
                        <div class="flex flex-wrap gap-2.5" id="categoryGroup">
                            <input type="checkbox" id="cat1" class="cat-checkbox" value="捕鱼游戏"><label for="cat1" class="cat-label">捕鱼游戏</label>
                            <input type="checkbox" id="cat2" class="cat-checkbox" value="棋牌对战"><label for="cat2" class="cat-label">棋牌对战</label>
                            <input type="checkbox" id="cat3" class="cat-checkbox" value="棋牌百人"><label for="cat3" class="cat-label">棋牌百人</label>
                            <input type="checkbox" id="cat4" class="cat-checkbox" value="街机游戏"><label for="cat4" class="cat-label">街机游戏</label>
                            <input type="checkbox" id="cat14" class="cat-checkbox" value="越南棋牌-百人类"><label for="cat14" class="cat-label">越南棋牌-百人类</label>
                            <input type="checkbox" id="cat5" class="cat-checkbox" value="老虎机"><label for="cat5" class="cat-label">老虎机</label>
                            <input type="checkbox" id="cat6" class="cat-checkbox" value="真人对战"><label for="cat6" class="cat-label">真人对战</label>
                            <input type="checkbox" id="cat7" class="cat-checkbox" value="电子彩票"><label for="cat7" class="cat-label">电子彩票</label>
                            <input type="checkbox" id="cat8" class="cat-checkbox" value="刮刮卡"><label for="cat8" class="cat-label">刮刮卡</label>
                            <input type="checkbox" id="cat9" class="cat-checkbox" value="特色游戏"><label for="cat9" class="cat-label">特色游戏</label>
                            <input type="checkbox" id="cat10" class="cat-checkbox" value="SSP棋牌(所有棋牌不分類)"><label for="cat10" class="cat-label">SSP棋牌</label>
                            <input type="checkbox" id="cat11" class="cat-checkbox" value="SSP電子"><label for="cat11" class="cat-label">SSP電子</label>
                            <input type="checkbox" id="cat12" class="cat-checkbox" value="SSP捕魚"><label for="cat12" class="cat-label">SSP捕魚</label>
                            <input type="checkbox" id="cat13" class="cat-checkbox" value="SSP平台"><label for="cat13" class="cat-label">SSP平台(全平台)</label>
                        </div>
                    </div>

                    <!-- 警告提示標語 (紅字加粗) -->
                    <div class="p-3 bg-red-50 border border-red-200 rounded-xl flex items-center gap-2">
                        <span class="text-red-600 font-extrabold text-sm tracking-wide">
                            ⚠️ SSP全平台维护时，DSG请同步发送PG维护！！！！
                            ⚠️ 越南百人-斗鸡目前只上DSG，其他包网待技术通知。
                        </span>
                    </div>

                    <!-- 模式快捷切換 -->
                    <div class="flex flex-wrap gap-2 pt-1 border-t border-slate-100">
                        <button type="button" id="btnModeDsg" onclick="selectMode('dsg')" class="mode-btn text-orange-600 bg-orange-50 border-orange-200">
                            新游戏上线(DSG)
                        </button>
                        <button type="button" id="btnModeSsp" onclick="selectMode('ssp')" class="mode-btn text-cyan-700 bg-cyan-50 border-cyan-200 flex items-center gap-1">
                            🚀 新游戏上线(SSP)
                        </button>
                        <button type="button" id="btnModeMaint" onclick="selectMode('maint')" class="mode-btn active-maint flex items-center gap-1">
                            🛠️ 例行/临时维护
                        </button>
                    </div>

                    <!-- 平台與公告類型 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">平台名称</label>
                            <input type="text" id="platform" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500" value="SSP平台">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">公告類型</label>
                            <select id="noticeType" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none bg-white focus:border-indigo-500">
                                <option value="例行维护通知">例行维护通知</option>
                                <option value="临时维护通知">临时维护通知</option>
                                <option value="新游戏上线通知">新游戏上线通知</option>
                                <option value="新游戏上架通知">新游戏上架通知</option>
                            </select>
                        </div>
                    </div>

                    <!-- 【DSG 游戏资讯手动填写】 -->
                    <div id="dsgGameSection" class="hidden p-4 bg-orange-50/60 border border-orange-200 rounded-xl space-y-2">
                        <span class="text-xs font-bold text-red-600">【DSG 游戏资讯手动填写】</span>
                        <div>
                            <label class="block text-[11px] text-red-500 font-semibold mb-1">新增游戏名称</label>
                            <input type="text" id="dsgGameName" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm bg-white outline-none focus:border-orange-400" placeholder="请输入游戏名称 (例如: 财神到)" value="">
                        </div>
                    </div>

                    <!-- 【SSP 游戏资讯手动填写】 -->
                    <div id="newGameSection" class="hidden p-4 bg-cyan-50/50 border border-cyan-100 rounded-xl space-y-3">
                        <span class="text-xs font-bold text-cyan-800">【SSP 游戏资讯手动填写】</span>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <div>
                                <label class="block text-[11px] text-slate-500 mb-1">名称(简中)</label>
                                <input type="text" id="gameCn" class="w-full border border-slate-200 rounded-md p-2 text-sm bg-white" placeholder="请输入名称" value="">
                            </div>
                            <div>
                                <label class="block text-[11px] text-slate-500 mb-1">名称(英)</label>
                                <input type="text" id="gameEn" class="w-full border border-slate-200 rounded-md p-2 text-sm bg-white" placeholder="请输入英文名称" value="">
                            </div>
                            <div>
                                <label class="block text-[11px] text-slate-500 mb-1">GameID</label>
                                <input type="text" id="gameId" class="w-full border border-slate-200 rounded-md p-2 text-sm bg-white" placeholder="请输入GameID" value="">
                            </div>
                            <div>
                                <label class="block text-[11px] text-slate-500 mb-1">游戏类型 (点击上方自动带入)</label>
                                <input type="text" id="gameCategoryText" class="w-full border border-slate-200 rounded-md p-2 text-sm bg-white" placeholder="若留空则不显示" value="">
                            </div>
                        </div>
                    </div>

                    <!-- 维护游戏清單 (維護模式使用) -->
                    <div id="maintSection">
                        <label class="block text-xs font-bold text-slate-500 mb-1">维护游戏清單 (勾选上方类别自动带入或自行编辑)</label>
                        <textarea id="gameList" rows="3" class="w-full border border-slate-200 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500" placeholder="请选择或输入维护游戏"></textarea>
                    </div>

                    <!-- 時間設置 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-1">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">开始/上线时间</label>
                            <div class="flex gap-1.5">
                                <input type="datetime-local" id="startTimePicker" class="flex-1 border border-slate-200 rounded-lg p-2 text-xs">
                                <button type="button" onclick="setStartNow()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 rounded-lg font-medium">即刻</button>
                            </div>
                            <label class="inline-flex items-center mt-1 text-xs text-slate-500 cursor-pointer">
                                <input type="checkbox" id="startImmediate" class="mr-1 rounded text-indigo-600"> 鎖定為「即刻」
                            </label>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">完成时间</label>
                            <div class="flex gap-1.5">
                                <input type="datetime-local" id="endTimePicker" class="flex-1 border border-slate-200 rounded-lg p-2 text-xs">
                                <button type="button" onclick="setEndPending()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-3 rounded-lg font-medium">待定</button>
                            </div>
                            <label class="inline-flex items-center mt-1 text-xs text-slate-500 cursor-pointer">
                                <input type="checkbox" id="endPending" class="mr-1 rounded text-indigo-600"> 鎖定為「待定」
                            </label>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 右側預覽區 -->
            <div class="lg:col-span-5">
                <div class="card p-6 border border-slate-100 sticky top-6">
                    <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md tracking-wider">PREVIEW</span>
                        <button onclick="copyText()" id="copyBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2 rounded-lg text-sm transition active:scale-95 shadow-md">
                            複製全文
                        </button>
                    </div>
                    <div id="output" class="text-slate-700 whitespace-pre-wrap leading-relaxed text-sm font-mono min-h-[380px]"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const el = id => document.getElementById(id);

        const gameData = {
            "捕鱼游戏": "捕鱼大亨、捕鱼大咖、渔乐天下、丛林派对",
            "棋牌对战": "二人麻将、单挑牛牛、21点、抢庄牌九、看三张抢庄牛牛、看四张抢庄牛牛、癞子牛牛、三公、对战二八杠、抢庄牛牛",
            "棋牌百人": "飞禽走兽、龙虎斗、奔驰宝马、红黑大战、森林舞会、百家乐、百人牛牛、百人骰宝、万人炸金花、万人推筒子",
            "街机游戏": "经典水果机、美女水果机、澳6水果机、水果机",
            "越南棋牌-百人类": "色碟、斗鸡",
            "老虎机": "SSP电子",
            "真人对战": "掼蛋",
            "电子彩票": "极速澳门六合彩",
            "刮刮卡": "五福临门、好运十倍、快乐8、点石成金（刮刮卡类型）、十倍幸运、大七、绿翡翠9、中国红、宝石之王",
            "特色游戏": "修仙渡劫、一飞冲天、宝石与地雷、星之塔",
            "SSP棋牌(所有棋牌不分類)": "SSP棋牌",
            "SSP電子": "SSP電子",
            "SSP捕魚": "SSP捕魚",
            "SSP平台": "SSP平台"
        };

        let currentMode = 'maint';

        function selectMode(mode) {
            currentMode = mode;
            
            el('btnModeDsg').className = mode === 'dsg' ? 'mode-btn active-dsg' : 'mode-btn text-orange-600 bg-orange-50 border-orange-200';
            el('btnModeSsp').className = mode === 'ssp' ? 'mode-btn active-ssp flex items-center gap-1' : 'mode-btn text-cyan-700 bg-cyan-50 border-cyan-200 flex items-center gap-1';
            el('btnModeMaint').className = mode === 'maint' ? 'mode-btn active-maint flex items-center gap-1' : 'mode-btn text-slate-600 bg-slate-50 border-slate-200 flex items-center gap-1';

            if (mode === 'dsg') {
                el('dsgGameSection').classList.remove('hidden');
                el('newGameSection').classList.add('hidden');
                el('maintSection').classList.add('hidden');
                el('noticeType').value = '新游戏上线通知';
            } else if (mode === 'ssp') {
                el('dsgGameSection').classList.add('hidden');
                el('newGameSection').classList.remove('hidden');
                el('maintSection').classList.add('hidden');
                el('noticeType').value = '新游戏上架通知';
            } else if (mode === 'maint') {
                el('dsgGameSection').classList.add('hidden');
                el('newGameSection').classList.add('hidden');
                el('maintSection').classList.remove('hidden');
                if (!el('noticeType').value.includes('维护')) {
                    el('noticeType').value = '例行维护通知';
                }
            }
            generate();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const M = String(d.getMonth() + 1).padStart(2, '0');
            const D = String(d.getDate()).padStart(2, '0');
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            return `${M}月${D}日 ${hh}:${mm} (GMT+8)`;
        }

        function cleanCategoryName(name) {
            return name.replace(/\([^)]*\)|（[^）]*）/g, '').trim();
        }

        function generate() {
            const platform = el('platform').value || 'SSP平台';
            const noticeType = el('noticeType').value;

            let startText = el('startImmediate').checked ? '即刻' : formatDate(el('startTimePicker').value);
            let endText = el('endPending').checked ? '待定' : formatDate(el('endTimePicker').value);

            let outputText = '';

            if (currentMode === 'dsg') {
                const dsgName = el('dsgGameName').value.trim() || 'xxxx';
                outputText = `尊敬的客户您好，兹通知您【${platform}】新游戏上线 通知

平台：【${platform}】
上线时间：${startText || '即刻'}
新增游戏：《${dsgName}》

以上游戏已默认为「开启」，若贵司需要调整设置，可至后台于「游戏管理」->「游戏设置」修改

若有任何问题欢迎随时与我们联系，谢谢您`;

            } else if (currentMode === 'ssp') {
                const cn = el('gameCn').value || '';
                const en = el('gameEn').value || '';
                const gid = el('gameId').value || '';
                const catType = el('gameCategoryText').value.trim();
                const catLine = catType ? `游戏类型：${catType}\n` : '';

                outputText = `尊敬的客户您好，兹通知您【${platform}】新游戏上架通知

【游戏资讯】
名称(简中)：${cn}
名称(英)：${en}
gameid：${gid}
${catLine}图标：如附件

请贵司务必更新，若未更新，将无法进行娱乐。
若有任何问题欢迎随时与我们联系，谢谢您！`;

            } else {
                const games = el('gameList').value;
                const formattedGames = games.split(/[，、, \n\t]+/).filter(s => s).map(s => `【${s}】`).join('');

                outputText = `尊敬的客户您好，兹通知您 【${platform}】 【单一游戏】${noticeType}
维护平台： 【${platform}】
维护游戏： ${formattedGames || '【待定】'}
开始时间：${startText || '即刻'}
完成时间：${endText || '待定'}
 
温馨提醒: 
◎维护期间内，维护产品将无法使用。
◎维护时间有任何异动，将会另行通知。
 
若有任何问题欢迎随时与我们联系，谢谢您！`;
            }

            el('output').innerText = outputText;
        }

        // 類別勾選事件
        document.querySelectorAll('.cat-checkbox').forEach(cb => {
            cb.addEventListener('change', () => {
                const checkedBoxes = Array.from(document.querySelectorAll('.cat-checkbox:checked'));
                const selected = checkedBoxes.map(c => c.value);
                
                let combined = [];
                selected.forEach(cat => {
                    if (gameData[cat]) {
                        combined = [...combined, ...gameData[cat].split(/[，、, ]+/)];
                    }
                });
                const uniqueGames = [...new Set(combined)];
                el('gameList').value = uniqueGames.join('、');

                if (currentMode === 'dsg' && uniqueGames.length > 0) {
                    el('dsgGameName').value = uniqueGames.join('、');
                }

                if (selected.length > 0) {
                    const cleanNames = selected.map(cleanCategoryName).filter(s => s);
                    el('gameCategoryText').value = cleanNames.join('、');
                } else {
                    el('gameCategoryText').value = '';
                }

                generate();
            });
        });

        function setStartNow() { el('startImmediate').checked = true; el('startTimePicker').disabled = true; generate(); }
        function setEndPending() { el('endPending').checked = true; el('endTimePicker').disabled = true; generate(); }

        ['platform', 'noticeType', 'dsgGameName', 'gameCn', 'gameEn', 'gameId', 'gameCategoryText', 'gameList', 'startTimePicker', 'endTimePicker'].forEach(id => {
            el(id).addEventListener('input', generate);
        });

        el('noticeType').addEventListener('change', (e) => {
            if (e.target.value.includes('维护')) {
                selectMode('maint');
            } else if (e.target.value === '新游戏上线通知') {
                selectMode('dsg');
            } else {
                selectMode('ssp');
            }
        });

        el('startImmediate').addEventListener('change', e => { el('startTimePicker').disabled = e.target.checked; generate(); });
        el('endPending').addEventListener('change', e => { el('endTimePicker').disabled = e.target.checked; generate(); });

        function copyText() {
            const text = el('output').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = el('copyBtn');
                const old = btn.innerText;
                btn.innerText = '已複製！';
                btn.classList.replace('bg-indigo-600', 'bg-green-600');
                setTimeout(() => {
                    btn.innerText = old;
                    btn.classList.replace('bg-green-600', 'bg-indigo-600');
                }, 1500);
            });
        }

        const now = new Date();
        el('startTimePicker').value = now.toISOString().slice(0, 16);
        el('endTimePicker').value = new Date(now.getTime() + 7200000).toISOString().slice(0, 16);

        selectMode('maint');
    </script>
</body>
</html>
